name: Build proposal PDF
on:
  push:
    branches: [main]
    paths:
      - 'docs/proposal/OPEP_Research_Proposal_v0.4.tex'
      - '.github/workflows/proposal-pdf.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: proposal-pdf
  cancel-in-progress: true
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-pictures lmodern poppler-utils
      - name: Compile and check
        working-directory: docs/proposal
        run: |
          mkdir -p /tmp/opep-build
          pdflatex -interaction=nonstopmode -halt-on-error -output-directory=/tmp/opep-build OPEP_Research_Proposal_v0.4.tex
          pdflatex -interaction=nonstopmode -halt-on-error -output-directory=/tmp/opep-build OPEP_Research_Proposal_v0.4.tex
          test "$(pdfinfo /tmp/opep-build/OPEP_Research_Proposal_v0.4.pdf | awk '/^Pages:/ {print $2}')" = 4
          cp /tmp/opep-build/OPEP_Research_Proposal_v0.4.pdf .
      - name: Publish compiled PDF
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/proposal/OPEP_Research_Proposal_v0.4.pdf
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Build OPEP proposal PDF revision 0.4"
          git pull --rebase origin main
          git push origin HEAD:main
